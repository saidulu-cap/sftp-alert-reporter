name: SFTP Alert Reporter

on:
  schedule:
    # Target 1:00 PM IST. GitHub cron can be 15-30 min late, so we schedule
    # at 07:00 UTC (12:30 PM IST) to reliably land around 1:00 PM IST.
    - cron: '0 7 * * *'
  workflow_dispatch:            # also allows manual trigger from GitHub UI

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Get the code ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Write OAuth credentials (base64-encoded, private repo) ───────────
      - name: Write OAuth credentials
        run: |
          mkdir -p credentials
          echo "" \
            | base64 -d > credentials/gmail_oauth.json
          echo "" \
            | base64 -d > credentials/token.json
          echo "gmail_oauth.json: $(wc -c < credentials/gmail_oauth.json) bytes"
          echo "token.json:       $(wc -c < credentials/token.json) bytes"

      # ── 4. Run the report ────────────────────────────────────────────────────
      - name: Run SFTP report
        env:
          REPORT_TO_EMAILS: "saidulu.gadari@capillarytech.com,shreya.revannavar@capillarytech.com"
          GOOGLE_CHAT_WEBHOOK_URL: "aHR0cHM6Ly9jaGF0Lmdvb2dsZWFwaXMuY29tL3YxL3NwYWNlcy9BQVFBLUpSQmZ4NC9tZXNzYWdlcz9rZXk9QUl6YVN5RGRJMGhDWnRFNnZ5U2pNbS1XRWZScTNDUHpxS3Fxc0hJJnRva2VuPTdXN1d4LW1GcjZYVkVJVWR3UW1oT0g0THpkYlNxdWJKZlRLdWt5cWUtR2c="
        run: |
          GOOGLE_CHAT_WEBHOOK_URL=$(echo "$GOOGLE_CHAT_WEBHOOK_URL" | base64 -d)
          export GOOGLE_CHAT_WEBHOOK_URL
          python sftp_report.py
