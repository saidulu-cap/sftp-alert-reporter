name: SFTP Alert Reporter

on:
  schedule:
    # 1:00 PM IST = 07:30 UTC  (IST is UTC+5:30)
    - cron: '30 7 * * *'
  workflow_dispatch:            # also allows manual trigger from GitHub UI

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Get the code ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Write secrets to disk (never committed to the repo) ───────────────
      - name: Write OAuth credentials
        env:
          GMAIL_OAUTH_JSON: ${{ secrets.GMAIL_OAUTH_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          mkdir -p credentials
          echo "$GMAIL_OAUTH_JSON" > credentials/gmail_oauth.json
          echo "$TOKEN_JSON"       > credentials/token.json

      # ── 4. Write .env (secrets substituted directly by GitHub Actions) ──────
      - name: Write .env file
        run: |
          printf 'REPORT_TO_EMAILS=%s\nGOOGLE_CHAT_WEBHOOK_URL=%s\n' \
            '${{ secrets.REPORT_TO_EMAILS }}' \
            '${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}' > .env
          echo "--- .env written, line count: $(wc -l < .env) ---"
          grep -c 'REPORT_TO_EMAILS' .env && echo "REPORT_TO_EMAILS line found" || echo "REPORT_TO_EMAILS MISSING!"

      # ── 5. Run the report ────────────────────────────────────────────────────
      - name: Run SFTP report
        run: python sftp_report.py
