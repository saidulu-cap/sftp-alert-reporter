name: SFTP Alert Reporter

on:
  schedule:
    # 1:00 PM IST = 07:30 UTC  (IST is UTC+5:30)
    - cron: '30 7 * * *'
  workflow_dispatch:            # also allows manual trigger from GitHub UI

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Get the code ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Write OAuth credentials from base64-encoded secrets ──────────────
      - name: Write OAuth credentials
        env:
          GMAIL_OAUTH_JSON_B64: ${{ secrets.GMAIL_OAUTH_JSON_B64 }}
          TOKEN_JSON_B64: ${{ secrets.TOKEN_JSON_B64 }}
        run: |
          mkdir -p credentials
          echo "$GMAIL_OAUTH_JSON_B64" | base64 -d > credentials/gmail_oauth.json
          echo "$TOKEN_JSON_B64"       | base64 -d > credentials/token.json
          echo "gmail_oauth.json size: $(wc -c < credentials/gmail_oauth.json) bytes"
          echo "token.json size:       $(wc -c < credentials/token.json) bytes"

      # ── 4. Run the report ────────────────────────────────────────────────────
      - name: Run SFTP report
        env:
          REPORT_TO_EMAILS: "saidulu.gadari@capillarytech.com,shreya.revannavar@capillarytech.com"
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: python sftp_report.py
